
<!DOCTYPE html>
<html>
<head>
<title>Fatma Zhra Surprise ❤️</title>

<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #d8b4fe);
    text-align: center;
    font-family: Arial;
    color: white;
    padding-top: 80px;
    overflow: hidden;
}

h1 { font-size: 40px; }

button {
    padding: 14px 28px;
    border: none;
    border-radius: 25px;
    font-size: 20px;
    cursor: pointer;
    margin: 10px;
}

#surpriseBtn {
    background: white;
    color: #ff4081;
}

#yes {
    background: #20c997;
    color: white;
}

#no {
    background: #ff4757;
    color: white;
    position: absolute;
}

#message {
    font-size: 27px;
    margin-top: 30px;
}
</style>
</head>

<body>

<h1>Hey Fatma Zhra! 🌸❤️</h1>

<p id="intro">Someone has a special surprise for you! 🎁</p>

<button id="surpriseBtn" onclick="nextSurprise()">
Open Your Surprise 🎁
</button>

<div id="message"></div>

<div id="question" style="display:none;">
    <h1>😂 Ek sawaal hai!</h1>
    <h2>Fatma Zhra, tum bail ho ki nahi? 🐂</h2>

    <button id="yes" onclick="yesClicked()">YES 😎</button>
    <button id="no" onmouseover="runAway()" onclick="runAway()">NO 🙄</button>
</div>

<script>

let count = 0;

function nextSurprise() {
    count++;

    if(count < 4) {
        document.getElementById("message").innerHTML =
        "Arey Fatma! Ek baar aur dabao 😂❤️";
    }
    else {
        document.getElementById("surpriseBtn").style.display = "none";
        document.getElementById("intro").style.display = "none";
        document.getElementById("message").style.display = "none";
        document.getElementById("question").style.display = "block";
    }
}

function runAway() {
    let no = document.getElementById("no");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 60);

    no.style.left = x + "px";
    no.style.top = y + "px";
}

function yesClicked() {
    document.getElementById("question").innerHTML =
    "<h1>VERY GOOD FATMA! 😂❤️</h1>" +
    "<h2>Mujhe pehle se hi pata tha! 🐂🤣</h2>" +
    "<h2>Keep Smiling! 🌸</h2>";
}

</script>

</body>
</html>
