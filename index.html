
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Fatma Zhra ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #d8b4fe);
    background-attachment: fixed;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 65px 20px 40px;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: clamp(30px, 8vw, 46px);
    margin-bottom: 20px;
}

p {
    font-size: clamp(19px, 5vw, 24px);
    line-height: 1.6;
}

button {
    border: none;
    border-radius: 40px;
    padding: 17px 30px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    margin: 12px;
    touch-action: manipulation;
}

#surpriseBtn {
    background: white;
    color: #ff4081;
}

#message {
    font-size: 23px;
    line-height: 1.7;
    margin-top: 25px;
}

#question {
    display: none;
    margin-top: 40px;
}

#yes {
    background: #20c997;
    color: white;
}

#no {
    background: #ff4757;
    color: white;
    position: relative;
}

.buttons {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 90px;
    gap: 15px;
}

.heart {
    position: fixed;
    bottom: -40px;
    pointer-events: none;
    animation: float 6s linear forwards;
    z-index: 1;
}

@keyframes float {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

@media(max-width: 400px) {
    .container {
        padding-top: 55px;
    }

    button {
        font-size: 18px;
        padding: 16px 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Hey Fatma Zhra! 🌸❤️</h1>

    <p id="intro">
        Someone has a little surprise for you! 🎁
    </p>

    <button id="surpriseBtn" onclick="nextSurprise()">
        Open Your Surprise 🎁
    </button>

    <div id="message"></div>

    <div id="question">

        <h1>😂 Ek Sawaal Hai!</h1>

        <p>Fatma Zhra, tum bail ho ki nahi? 🐂😂</p>

        <div class="buttons">
            <button id="yes" onclick="yesClicked()">
                YES 😎
            </button>

            <button id="no" onclick="runAway()">
                NO 🙄
            </button>
        </div>

    </div>

</div>

<script>

let count = 0;

function nextSurprise() {

    count++;

    if (count < 4) {

        document.getElementById("message").innerHTML =
        "Arey Fatma! Ek baar aur dabao 😂❤️";

    } else {

        document.getElementById("surpriseBtn").style.display = "none";
        document.getElementById("intro").style.display = "none";
        document.getElementById("message").style.display = "none";
        document.getElementById("question").style.display = "block";

    }
}

function runAway() {

    let no = document.getElementById("no");

    let maxX = window.innerWidth - no.offsetWidth - 15;
    let maxY = window.innerHeight - no.offsetHeight - 15;

    let x = Math.random() * Math.max(10, maxX);
    let y = Math.random() * Math.max(10, maxY);

    no.style.position = "fixed";
    no.style.left = x + "px";
    no.style.top = y + "px";
    no.style.zIndex = "10";
}

function yesClicked() {

    document.getElementById("question").innerHTML = `
        <h1>VERY GOOD FATMA! 😂❤️</h1>
        <p>Mujhe pehle se hi pata tha! 🐂🤣</p>
        <p>Keep Smiling Always! 🌸</p>
        <h1>😂😂❤️</h1>
    `;

}

setInterval(function() {

    let heart = document.createElement("div");

    heart.className = "heart";
    heart.innerHTML = Math.random() > 0.5 ? "❤️" : "🌸";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = "25px";

    document.body.appendChild(heart);

    setTimeout(function() {
        heart.remove();
    }, 6000);

}, 500);

</script>

</body>
</html>
